name: gestion-datos

x-servicio-env: &servicio-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-personas_db}
  DB_USER: ${DB_USER:-app}
  DB_PASSWORD: ${DB_PASSWORD:-app_pass}
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/gestion}
  JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/gestion/protocol/openid-connect/certs}

x-microservicio: &microservicio
  environment: *servicio-env
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  # ---------- Base de datos (contenedor independiente) ----------
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-personas_db}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-personas_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Microservicios (uno por opción del menú) ----------
  crear:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: crear } }
  modificar:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: modificar } }
  borrar:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: borrar } }
  logs:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: logs } }

  # "Consultar": contenedor independiente, habilitable/deshabilitable según demanda
  #   habilitar:     docker compose --profile consulta up -d consultar
  #   deshabilitar:  docker compose stop consultar
  consultar:
    <<: *microservicio
    profiles: ["consulta"]
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: consultar } }

  # ---------- Frontend + proxy ----------
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    restart: unless-stopped

  # ---------- n8n (chat de lenguaje natural + RAG) ----------
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: America/Bogota
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/backup/workflows:ro
    depends_on:
      db: { condition: service_healthy }

  # ---------- SSO (activar con --profile auth) ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    profiles: ["auth"]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]

volumes:
  pgdata:
  n8n_data:
